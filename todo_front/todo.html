<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>ToDo</title>
        <link rel="stylesheet" href="styles.css">
        <script src="script.js"></script>
        <script src="load_data.js"></script>
</head>
    <body>
        <div class="create-task">

            <label>Category: 
                <!-- Replace with stored projects / categories -->
                <select id="category">
                </select>
            </label>   

            <div class="form-spacer"></div>

            <label>Sub-Category:
                <!-- Replace with stored projects / categories -->
                <select id="subcategory">
                </select>
            </label>

            <div class="form-spacer"></div>

            <label>Project:
                <select id="project">
                </select>
            </label>

            <div class="form-spacer"></div>

            <label>Task name: 
                <input id="task-name"></input>
            </label>

            <div class="form-spacer"></div>

            <label>Description:
                <input id="task-description"></input>
            </label>

            <div class="form-spacer"></div>

            <label>Priority:
                <select id="priority">
                    <option>Low</option>
                    <option>Medium</option>
                    <option>High</option>
                </select>
            </label>

            <div class="form-spacer"></div>

            <label>Due:
                <input type="date" id="due-date"></input>
            </label>

            <div class="form-spacer"></div>

            <label>Notes:
                <input id="notes"></input>
            </label>

            <div class="form-spacer"></div>

            <button onclick="addTask()">Add</button>
        </div>

        <div class="recent-tasks"></div>
    </body>
</html>
